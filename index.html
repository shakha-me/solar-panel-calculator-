<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2545; --navy-soft:#3A4F6D; --sun:#FFB627; --orange:#F77F00;
    --cream:#FFF6DC; --card:#fff; --line:#F0E3BC; --bad:#B3261E;
    --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
    --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--navy);background:#FFFBF0;line-height:1.55}
  h1,h2,h3{font-family:var(--head);color:var(--navy);line-height:1.15;margin:0}
  .wrap{max-width:1020px;margin:0 auto;padding:0 20px}

  /* ---------- Hero ---------- */
  .hero{background:linear-gradient(180deg,var(--cream),#FFFBF0);padding:20px 0 36px;overflow:hidden}
  .topbar{display:flex;justify-content:flex-end}
  .lang{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{border:0;background:none;font:700 .85rem var(--body);color:var(--navy-soft);padding:6px 14px;border-radius:999px;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
  .hero-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;margin-top:18px}
  .hero h1{font-size:clamp(2rem,5.5vw,3.4rem);font-weight:800;letter-spacing:-.02em}
  .hero p{font-size:1.15rem;color:var(--navy-soft);max-width:34ch;margin:14px 0 0}
  .sun-art{width:100%;max-width:300px;justify-self:center}
  .rays{transform-origin:150px 130px;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- Cards & form ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 6px 24px rgba(11,37,69,.07)}
  .form-card{margin-top:-6px}
  form{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
  label{display:block;font-weight:700;margin-bottom:6px}
  input,select{width:100%;font:inherit;color:var(--navy);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
  input:focus,select:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px;border-color:var(--orange)}
  .invalid{border-color:var(--bad)}
  .err{color:var(--bad);font-size:.88rem;margin:6px 0 0;min-height:1.2em}
  .btn{grid-column:1/-1;border:0;cursor:pointer;font:800 1.1rem var(--head);padding:14px 26px;border-radius:14px;
       background:linear-gradient(135deg,var(--sun),var(--orange));color:var(--navy);transition:transform .15s,box-shadow .15s;justify-self:start}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(247,127,0,.35)}

  /* ---------- Results ---------- */
  #results{display:none;margin-top:28px}
  #results.show{display:block;animation:rise .6s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .warn{background:#FFF0D1;border-left:5px solid var(--orange);padding:12px 16px;border-radius:10px;margin-bottom:18px}
  .verdict{font-family:var(--head);font-size:1.35rem;font-weight:800;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;border-top:4px solid var(--sun)}
  .stat.key{border-top-color:var(--orange);background:var(--cream)}
  .stat small{display:block;color:var(--navy-soft);font-weight:600}
  .stat b{display:block;font:800 1.35rem var(--head);margin-top:4px;word-break:break-word}
  .stat span{font-size:.85rem;color:var(--navy-soft)}
  .chart-card{margin-top:18px}
  .chart-box{position:relative;height:340px}

  /* ---------- Info ---------- */
  section.info{padding:44px 0 0}
  section.info h2{font-size:1.7rem;margin-bottom:16px}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;list-style:none;padding:0;margin:0;counter-reset:s}
  .steps li{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
  .steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sun);font:800 1rem var(--head);margin-bottom:10px}
  .disclaimer{margin:44px 0;background:var(--navy);color:#E8EEF7;border-radius:16px;padding:20px 24px}
  .disclaimer h3{color:#fff;margin-bottom:6px}
  .disclaimer p{margin:0}

  @media (max-width:820px){
    .hero-grid{grid-template-columns:1fr}.sun-art{max-width:200px;order:-1}
    form{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}
    .chart-box{height:280px}
  }
  @media (prefers-reduced-motion:reduce){.rays{animation:none}#results.show{animation:none}.btn{transition:none}}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="topbar">
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="uz" aria-pressed="true">UZ</button>
        <button data-lang="en" aria-pressed="false">EN</button>
        <button data-lang="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <div class="hero-grid">
      <div>
        <h1 data-i18n="title"></h1>
        <p data-i18n="tagline"></p>
      </div>
      <!-- Inline SVG: sun with slowly turning rays above a solar panel -->
      <svg class="sun-art" viewBox="0 0 300 260" aria-hidden="true">
        <g class="rays" stroke="#FFB627" stroke-width="10" stroke-linecap="round">
          <line x1="150" y1="40" x2="150" y2="62"/><line x1="150" y1="198" x2="150" y2="220"/>
          <line x1="40" y1="130" x2="62" y2="130"/><line x1="238" y1="130" x2="260" y2="130"/>
          <line x1="72" y1="52" x2="88" y2="68"/><line x1="212" y1="192" x2="228" y2="208"/>
          <line x1="228" y1="52" x2="212" y2="68"/><line x1="88" y1="192" x2="72" y2="208"/>
        </g>
        <circle cx="150" cy="130" r="48" fill="#F77F00"/><circle cx="150" cy="130" r="38" fill="#FFB627"/>
        <g transform="translate(70 168)">
          <path d="M14 0h132l14 62H0z" fill="#0B2545"/>
          <g stroke="#6FA3E8" stroke-width="2"><path d="M54 0l-6 62M100 0l6 62M7 31h146"/></g>
        </g>
      </svg>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card form-card">
    <form id="calcForm" novalidate>
      <div>
        <label for="bill" data-i18n="bill"></label>
        <input id="bill" type="number" inputmode="numeric" min="0" step="1000" placeholder="300000">
        <p class="err" id="err-bill" role="alert"></p>
      </div>
      <div>
        <label for="city" data-i18n="city"></label>
        <select id="city"></select>
        <p class="err" id="err-city" role="alert"></p>
      </div>
      <div>
        <label for="roof" data-i18n="roof"></label>
        <input id="roof" type="number" inputmode="decimal" min="0" step="1" placeholder="30">
        <p class="err" id="err-roof" role="alert"></p>
      </div>
      <button class="btn" type="submit" data-i18n="calc"></button>
    </form>
  </div>

  <section id="results" aria-live="polite">
    <div class="card">
      <div id="warn" class="warn" hidden></div>
      <div class="verdict" id="verdict"></div>
      <div class="stats">
        <div class="stat"><small data-i18n="panels"></small><b id="r-panels"></b><span data-i18n="pcs"></span></div>
        <div class="stat"><small data-i18n="size"></small><b id="r-size"></b><span>kW</span></div>
        <div class="stat"><small data-i18n="cost"></small><b id="r-cost"></b><span data-i18n="som"></span></div>
        <div class="stat"><small data-i18n="monthly"></small><b id="r-monthly"></b><span data-i18n="somMonth"></span></div>
        <div class="stat key"><small data-i18n="payback"></small><b id="r-payback"></b><span data-i18n="years"></span></div>
      </div>
    </div>
    <div class="card chart-card">
      <h2 style="font-size:1.25rem;margin-bottom:12px" data-i18n="chartTitle"></h2>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </div>
  </section>

  <section class="info">
    <h2 data-i18n="howTitle"></h2>
    <ol class="steps">
      <li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li>
    </ol>
  </section>

  <div class="disclaimer">
    <h3 data-i18n="discTitle"></h3>
    <p data-i18n="disc"></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
/* =====================================================================
   SETTINGS — change the numbers here. All values are ESTIMATES (placeholders):
   check real tariffs, equipment prices and local sunshine data before use.
   ===================================================================== */
const SETTINGS = {
  electricityPricePerKwh: 1000,   // so'm per kWh (household tariff, estimate)
  panelPowerKw: 0.55,             // one panel = 550 W
  panelAreaM2: 3.0,               // roof area one panel needs, incl. spacing
  pricePerKw: 9500000,            // so'm per installed kW (panels + inverter + work)
  performanceRatio: 0.8,          // real-world losses (heat, dust, inverter, cables)
  yearlyDegradation: 0.005,       // panels lose ~0.5% output each year
  chartYears: 20,
  // Average peak sun hours per day (equivalent hours of full sunlight)
  sunHours: {
    tashkent: 4.8, samarkand: 5.2, bukhara: 5.4, namangan: 4.8, andijan: 4.8,
    fergana: 4.9, nukus: 4.9, termez: 5.6, qarshi: 5.5, navoiy: 5.4
  }
};

/* ---------------- Translations: every visible text lives here ---------------- */
const CITY_NAMES = {
  uz: {tashkent:"Toshkent",samarkand:"Samarqand",bukhara:"Buxoro",namangan:"Namangan",andijan:"Andijon",fergana:"Fargʻona",nukus:"Nukus",termez:"Termiz",qarshi:"Qarshi",navoiy:"Navoiy"},
  en: {tashkent:"Tashkent",samarkand:"Samarkand",bukhara:"Bukhara",namangan:"Namangan",andijan:"Andijan",fergana:"Fergana",nukus:"Nukus",termez:"Termez",qarshi:"Qarshi",navoiy:"Navoiy"},
  ru: {tashkent:"Ташкент",samarkand:"Самарканд",bukhara:"Бухара",namangan:"Наманган",andijan:"Андижан",fergana:"Фергана",nukus:"Нукус",termez:"Термез",qarshi:"Карши",navoiy:"Навои"}
};

const T = {
  uz: {
    title:"Quyosh panellari sizga foydalimi?",
    tagline:"Elektr hisobingizni kiriting va panellar qancha tejashini bilib oling.",
    bill:"Oylik elektr hisobi (soʻm)", city:"Shahar", cityPick:"Shaharni tanlang", roof:"Tom maydoni (m²)",
    calc:"Hisoblash",
    errBill:"Oylik hisobni kiriting (kamida 10 000 soʻm).", errCity:"Shaharni tanlang.",
    errRoof:"Tom maydonini kiriting (kamida {min} m²).",
    panels:"Kerakli panellar", pcs:"dona", size:"Tizim quvvati", cost:"Umumiy narx", som:"soʻm",
    monthly:"Oylik tejash", somMonth:"soʻm / oy", payback:"Oʻzini oqlashi", years:"yil",
    warnRoof:"Tomingiz kichik: {need} ta panel kerak, lekin {max} tasi sigʻadi. Hisob {max} ta panel bilan qilindi.",
    vGreat:"Juda foydali: tizim tez oqlanadi.", vGood:"Foydali: tizim bir necha yilda oqlanadi.",
    vLong:"Uzoq muddatli: tizim sekin oqlanadi, lekin panellar 25 yil ishlaydi.",
    chartTitle:"20 yillik jami tejash", lineSave:"Jami tejash", lineCost:"Oʻrnatish narxi", year:"Yil",
    howTitle:"Qanday ishlaydi",
    how1:"Hisobingizni elektr narxiga boʻlib, oylik iste'molni (kVt·soat) topamiz.",
    how2:"Shahringizdagi quyosh soatlariga qarab kerakli panellar sonini va tom sigʻimini tekshiramiz.",
    how3:"Narx, oylik tejash va oʻzini oqlash muddatini hisoblab, 20 yillik grafikni chizamiz.",
    discTitle:"Muhim eslatma",
    disc:"Natijalar taxminiy. Narxlar, tarif va quyosh soatlari oʻrtacha qiymatlar; haqiqiy natija tom yoʻnalishi, soya va uskunaga bogʻliq. Qaror qilishdan oldin mutaxassisdan aniq taklif oling."
  },
  en: {
    title:"Are solar panels worth it for you?",
    tagline:"Enter your electricity bill and see how much solar could save you.",
    bill:"Monthly electricity bill (so'm)", city:"City", cityPick:"Choose a city", roof:"Roof area (m²)",
    calc:"Calculate",
    errBill:"Enter your monthly bill (at least 10,000 so'm).", errCity:"Choose a city.",
    errRoof:"Enter your roof area (at least {min} m²).",
    panels:"Panels needed", pcs:"panels", size:"System size", cost:"Total cost", som:"so'm",
    monthly:"Monthly savings", somMonth:"so'm / month", payback:"Payback time", years:"years",
    warnRoof:"Your roof is small: you need {need} panels but only {max} fit. Results use {max} panels.",
    vGreat:"Great value: the system pays for itself quickly.", vGood:"Worth it: the system pays back in a few years.",
    vLong:"Long-term: slow payback, but panels last about 25 years.",
    chartTitle:"Cumulative savings over 20 years", lineSave:"Cumulative savings", lineCost:"Installation cost", year:"Year",
    howTitle:"How it works",
    how1:"We divide your bill by the electricity price to estimate monthly use (kWh).",
    how2:"Using your city's sun hours, we find the panels you need and check they fit on your roof.",
    how3:"We calculate cost, monthly savings and payback, then plot 20 years of savings.",
    discTitle:"Please note",
    disc:"Results are estimates. Prices, tariffs and sun hours are averages; real results depend on roof direction, shade and equipment. Get a detailed quote from an installer before deciding."
  },
  ru: {
    title:"Окупятся ли солнечные панели?",
    tagline:"Введите счёт за электричество и узнайте, сколько сэкономят панели.",
    bill:"Ежемесячный счёт за электричество (сум)", city:"Город", cityPick:"Выберите город", roof:"Площадь крыши (м²)",
    calc:"Рассчитать",
    errBill:"Введите ежемесячный счёт (не менее 10 000 сум).", errCity:"Выберите город.",
    errRoof:"Введите площадь крыши (не менее {min} м²).",
    panels:"Нужно панелей", pcs:"шт.", size:"Мощность системы", cost:"Общая стоимость", som:"сум",
    monthly:"Экономия в месяц", somMonth:"сум / мес.", payback:"Срок окупаемости", years:"лет",
    warnRoof:"Крыша небольшая: нужно {need} панелей, но помещается {max}. Расчёт сделан для {max} панелей.",
    vGreat:"Очень выгодно: система окупается быстро.", vGood:"Выгодно: система окупится за несколько лет.",
    vLong:"Долгий срок: окупаемость медленная, но панели служат около 25 лет.",
    chartTitle:"Накопленная экономия за 20 лет", lineSave:"Накопленная экономия", lineCost:"Стоимость установки", year:"Год",
    howTitle:"Как это работает",
    how1:"Делим счёт на цену электричества и получаем месячное потребление (кВт·ч).",
    how2:"По солнечным часам вашего города находим число панелей и проверяем, что они поместятся на крыше.",
    how3:"Считаем стоимость, экономию и срок окупаемости и строим график на 20 лет.",
    discTitle:"Важно",
    disc:"Результаты приблизительные. Цены, тарифы и солнечные часы — средние значения; реальный итог зависит от ориентации крыши, тени и оборудования. Перед решением запросите точное предложение у установщика."
  }
};

/* ---------------- State & helpers ---------------- */
let lang = "uz";          // default language
let lastResult = null;    // kept so we can redraw when the language changes
let errorKeys = {};       // current form errors, e.g. { bill: "errBill" }
let chart = null;

const $ = (id) => document.getElementById(id);
const t = (key) => T[lang][key];
const fmt = (n) => Math.round(n).toLocaleString("ru-RU");   // 1 234 567

/* ---------------- The calculation ---------------- */
function calculate(bill, cityKey, roofM2) {
  const S = SETTINGS;

  // 1) Monthly use (kWh) = bill / price per kWh
  const monthlyKwh = bill / S.electricityPricePerKwh;

  // 2) One panel's monthly output (kWh)
  //    = power (kW) x peak sun hours per day x 30 days x performance ratio
  const kwhPerPanel = S.panelPowerKw * S.sunHours[cityKey] * 30 * S.performanceRatio;

  // 3) Panels to cover all use (round up) vs. panels that fit on the roof (round down)
  const needed = Math.ceil(monthlyKwh / kwhPerPanel);
  const maxFit = Math.floor(roofM2 / S.panelAreaM2);
  const panels = Math.min(needed, maxFit);
  const roofTooSmall = needed > maxFit;

  // 4) System size (kW) and installation cost (so'm)
  const sizeKw = panels * S.panelPowerKw;
  const cost = sizeKw * S.pricePerKw;

  // 5) Savings: energy produced replaces bought energy (never more than you use)
  const producedKwh = panels * kwhPerPanel;
  const monthlySavings = Math.min(producedKwh, monthlyKwh) * S.electricityPricePerKwh;
  const yearlySavings = monthlySavings * 12;

  // 6) Payback (years) = cost / yearly savings
  const payback = cost / yearlySavings;

  // 7) Cumulative savings for the chart (output drops slightly each year)
  const cumulative = [0];
  for (let y = 1; y <= S.chartYears; y++) {
    const factor = Math.pow(1 - S.yearlyDegradation, y - 1);
    cumulative.push(cumulative[y - 1] + yearlySavings * factor);
  }
  return { needed, maxFit, panels, roofTooSmall, sizeKw, cost, monthlySavings, yearlySavings, payback, cumulative };
}

/* ---------------- Validation ---------------- */
function validate() {
  const bill = parseFloat($("bill").value);
  const roof = parseFloat($("roof").value);
  const city = $("city").value;
  errorKeys = {};
  if (!(bill >= 10000)) errorKeys.bill = "errBill";
  if (!city) errorKeys.city = "errCity";
  if (!(roof >= SETTINGS.panelAreaM2)) errorKeys.roof = "errRoof";
  showErrors();
  return Object.keys(errorKeys).length ? null : { bill, roof, city };
}

function showErrors() {
  ["bill", "city", "roof"].forEach((f) => {
    const key = errorKeys[f];
    $("err-" + f).textContent = key ? t(key).replace("{min}", SETTINGS.panelAreaM2) : "";
    $(f).classList.toggle("invalid", !!key);
  });
}

/* ---------------- Showing results ---------------- */
function render(r) {
  $("r-panels").textContent = fmt(r.panels);
  $("r-size").textContent = r.sizeKw.toFixed(2);
  $("r-cost").textContent = fmt(r.cost);
  $("r-monthly").textContent = fmt(r.monthlySavings);
  $("r-payback").textContent = r.payback.toFixed(1);

  const warn = $("warn");
  warn.hidden = !r.roofTooSmall;
  warn.textContent = r.roofTooSmall
    ? t("warnRoof").replace(/\{need\}/g, r.needed).replace(/\{max\}/g, r.maxFit) : "";

  $("verdict").textContent = r.payback <= 6 ? t("vGreat") : r.payback <= 10 ? t("vGood") : t("vLong");
  drawChart(r);
}

function drawChart(r) {
  if (typeof Chart === "undefined") return;       // CDN not reachable: skip the chart
  if (chart) chart.destroy();
  const labels = r.cumulative.map((_, i) => i);
  chart = new Chart($("chart"), {
    type: "line",
    data: { labels, datasets: [
      { label: t("lineSave"), data: r.cumulative.map(Math.round), borderColor: "#F77F00",
        backgroundColor: "rgba(255,182,39,.2)", fill: true, tension: .25, pointRadius: 0, borderWidth: 3 },
      { label: t("lineCost"), data: labels.map(() => Math.round(r.cost)), borderColor: "#0B2545",
        borderDash: [8, 6], pointRadius: 0, borderWidth: 2 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: { tooltip: { callbacks: { label: (c) => c.dataset.label + ": " + fmt(c.parsed.y) + " " + t("som") } } },
      scales: {
        x: { title: { display: true, text: t("year") } },
        y: { ticks: { callback: (v) => (v / 1e6) + " M" } }   // millions of so'm
      }
    }
  });
}

/* ---------------- Language switching ---------------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));

  // Rebuild the city list in the new language, keeping the current choice
  const sel = $("city"), keep = sel.value;
  sel.innerHTML = '<option value="">' + t("cityPick") + "</option>" +
    Object.keys(SETTINGS.sunHours).map((k) => '<option value="' + k + '">' + CITY_NAMES[lang][k] + "</option>").join("");
  sel.value = keep;

  showErrors();
  if (lastResult) render(lastResult);
}

document.querySelectorAll(".lang button").forEach((b) =>
  b.addEventListener("click", () => { lang = b.dataset.lang; applyLang(); }));

/* ---------------- Form ---------------- */
$("calcForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const v = validate();
  if (!v) { $("results").classList.remove("show"); return; }
  lastResult = calculate(v.bill, v.city, v.roof);
  render(lastResult);
  const box = $("results");
  box.classList.remove("show"); void box.offsetWidth;   // restart the animation
  box.classList.add("show");
  box.scrollIntoView({ behavior: "smooth", block: "start" });
});

applyLang();
</script>
</body>
</html>
